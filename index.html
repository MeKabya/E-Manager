<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Manager · Cycle Rental Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F1;
    --surface:#FFFFFF;
    --surface-2:#EEF0E9;
    --border:#DCE1D6;
    --text:#1B231D;
    --text-dim:#5B655B;
    --accent:#2F6F4E;
    --accent-ink:#FFFFFF;
    --accent-soft:#E3EFE7;
    --amber:#D9791E;
    --amber-soft:#FBEBD9;
    --danger:#C24545;
    --danger-soft:#F7E4E4;
    --shadow:0 1px 2px rgba(20,30,20,.04), 0 6px 20px rgba(20,30,20,.06);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --font-head:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
  }
  [data-theme="dark"]{
    --bg:#10140F;
    --surface:#181D16;
    --surface-2:#1F251C;
    --border:#2B331F;
    --text:#EAEFE4;
    --text-dim:#93A08B;
    --accent:#57C98A;
    --accent-ink:#0B1A10;
    --accent-soft:#1C3324;
    --amber:#F5A84B;
    --amber-soft:#33260F;
    --danger:#E27171;
    --danger-soft:#3A1E1E;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .35s ease, color .35s ease;
  }
  h1,h2,h3,.font-head{font-family:var(--font-head);}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- Loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:999;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-wheel{width:64px;height:64px;animation:spin 1.1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader-word{font-family:var(--font-head);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--text-dim);}
  .loader-dots{display:flex;gap:6px;}
  .loader-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 1s infinite ease-in-out;}
  .loader-dots span:nth-child(2){animation-delay:.15s;}
  .loader-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotpulse{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-4px);}}

  /* ---------- App shell ---------- */
  #app{opacity:0;transition:opacity .5s ease;}
  #app.ready{opacity:1;}

  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-s);
    border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:18px;height:18px;stroke:var(--text);}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-credit{font-size:9.5px;font-weight:500;opacity:.5;align-self:flex-end;letter-spacing:.01em;color:#8A8A8A;}
  [data-theme="dark"] .brand-credit{color:#E24444;}
  .brand-name{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:-.01em;}
  .brand-date{font-size:12.5px;color:var(--text-dim);display:none;}
  @media(min-width:720px){.brand-date{display:inline;margin-left:6px;padding-left:12px;border-left:1px solid var(--border);}}

  .theme-toggle{
    position:relative;width:52px;height:28px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;padding:2px;
    transition:background .3s ease;
  }
  .theme-toggle .thumb{
    width:22px;height:22px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transform:translateX(0);transition:transform .3s cubic-bezier(.4,0,.2,1), background .3s ease;
  }
  [data-theme="dark"] .theme-toggle .thumb{transform:translateX(24px);}
  .theme-toggle svg{width:13px;height:13px;stroke:var(--accent-ink);fill:none;}

  /* ---------- Drawer ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(10,15,10,.35);z-index:49;
    opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s ease;
  }
  .backdrop.show{opacity:1;visibility:visible;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:250px;z-index:50;
    background:var(--surface);border-right:1px solid var(--border);
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;padding:18px 14px;gap:4px;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 18px;}
  .drawer-title{font-family:var(--font-head);font-weight:700;font-size:17px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-s);
    color:var(--text-dim);border:1px solid transparent;background:none;text-align:left;width:100%;
    font-size:14.5px;font-weight:500;transition:background .18s ease, color .18s ease;
  }
  .nav-item svg{width:17px;height:17px;stroke:currentColor;flex:none;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .drawer-foot{margin-top:auto;padding:10px 8px;font-size:12px;color:var(--text-dim);border-top:1px solid var(--border);}

  /* ---------- Layout ---------- */
  main{padding:22px 20px 80px;max-width:1080px;margin:0 auto;}
  .view{animation:viewfade .35s ease;}
  @keyframes viewfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .view-title{font-size:22px;font-weight:700;margin:0;}
  .view-sub{color:var(--text-dim);font-size:13.5px;margin:2px 0 0;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-s);
    font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .btn svg{width:15px;height:15px;stroke:currentColor;}
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px;}
  .stat{padding:16px;}
  .stat-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
  .stat-value{font-family:var(--font-head);font-size:24px;font-weight:700;margin-top:6px;}
  .stat.accent{border-color:var(--accent);}
  .stat.warn .stat-value{color:var(--amber);}

  /* ---------- Schedule ---------- */
  .schedule-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:860px){.schedule-grid{grid-template-columns:1.1fr 1fr;}}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;}
  .cal-month{font-family:var(--font-head);font-weight:600;font-size:15.5px;}
  .cal-nav{display:flex;gap:6px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px 0;font-size:11px;color:var(--text-dim);text-align:center;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 14px;}
  .cal-cell{
    position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13px;background:transparent;color:var(--text);transition:background .15s ease, border-color .15s ease;
  }
  .cal-cell:hover{background:var(--surface-2);}
  .cal-cell.muted{color:var(--text-dim);opacity:.45;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.selected{background:var(--accent);color:var(--accent-ink);}
  .cal-dots{display:flex;gap:2px;height:5px;}
  .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cal-dot.due{background:var(--amber);}
  .cal-cell.selected .cal-dot{background:var(--accent-ink);}

  .agenda-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  .agenda-title{font-weight:600;font-size:14.5px;}
  .timeline{position:relative;padding:10px 16px 6px 54px;}
  .tl-row{position:relative;height:38px;border-top:1px dashed var(--border);}
  .tl-row:last-child{border-bottom:1px dashed var(--border);}
  .tl-label{position:absolute;left:-46px;top:-7px;font-size:10.5px;color:var(--text-dim);width:40px;text-align:right;}
  .tl-row:hover{background:var(--surface-2);cursor:pointer;}
  .tl-block{
    position:absolute;left:4px;right:4px;border-radius:6px;padding:3px 7px;
    background:var(--accent-soft);border-left:3px solid var(--accent);
    font-size:11.5px;overflow:hidden;cursor:pointer;line-height:1.25;z-index:2;
    transition:filter .15s ease;
  }
  .tl-block:hover{filter:brightness(.96);}
  .tl-block.due{background:var(--amber-soft);border-left-color:var(--amber);}
  .tl-block b{display:block;font-size:11.5px;}

  .agenda-list{padding:8px 14px 16px;display:flex;flex-direction:column;gap:8px;}
  .booking-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);
    background:var(--surface);
  }
  .booking-time{font-family:var(--font-head);font-weight:600;font-size:12.5px;min-width:82px;color:var(--text-dim);}
  .booking-info{flex:1;min-width:0;}
  .booking-name{font-weight:600;font-size:13.5px;}
  .booking-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.paid{background:var(--accent-soft);color:var(--accent);}
  .badge.due{background:var(--amber-soft);color:var(--amber);}
  .row-actions{display:flex;gap:4px;}

  .empty{padding:34px 20px;text-align:center;color:var(--text-dim);font-size:13px;}
  .empty svg{width:34px;height:34px;stroke:var(--border);margin-bottom:8px;}

  .search-wrap{position:relative;flex:1;min-width:160px;max-width:260px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-dim);}
  .search-wrap input{width:100%;padding:8px 10px 8px 30px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);font-size:13px;}

  /* ---------- Payment ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .section-title{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}

  /* ---------- Contact ---------- */
  .form-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:18px;}
  @media(min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr;}}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text-dim);}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--surface);font-size:13.5px;transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .check-row{display:flex;align-items:center;gap:8px;}
  .switch{position:relative;width:38px;height:22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);flex:none;}
  .switch .dot{width:16px;height:16px;border-radius:50%;background:var(--text-dim);position:absolute;top:2px;left:2px;transition:transform .2s ease, background .2s ease;}
  .switch.on{background:var(--accent-soft);border-color:var(--accent);}
  .switch.on .dot{transform:translateX(16px);background:var(--accent);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,15,10,.4);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s ease;
  }
  @media(min-width:640px){.modal-backdrop{align-items:center;}}
  .modal-backdrop.show{opacity:1;visibility:visible;}
  .modal{
    background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:460px;max-height:88vh;overflow:auto;
    transform:translateY(30px);opacity:0;transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    border:1px solid var(--border);
  }
  @media(min-width:640px){.modal{border-radius:var(--radius-l);}}
  .modal-backdrop.show .modal{transform:translateY(0);opacity:1;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
  .modal-title{font-weight:700;font-size:15.5px;}
  .modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:13px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-foot{display:flex;gap:8px;padding:14px 18px 18px;}
  .modal-foot .btn{flex:1;justify-content:center;}
  .error-text{color:var(--danger);font-size:12px;min-height:14px;}
  .radio-group{display:flex;gap:8px;}
  .radio-opt{flex:1;text-align:center;padding:9px;border-radius:var(--radius-s);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-dim);transition:.18s ease;}
  .radio-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* ---------- Toast ---------- */
  #toast-container{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:30px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .25s ease, transform .25s ease;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast svg{width:14px;height:14px;stroke:var(--bg);}

  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
</style>
</head>
<body>

<div id="loader">
  <svg class="loader-wheel" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="26" stroke="#2F6F4E" stroke-width="3"/>
    <g stroke="#2F6F4E" stroke-width="2">
      <line x1="32" y1="6" x2="32" y2="58"/>
      <line x1="6" y1="32" x2="58" y2="32"/>
      <line x1="13" y1="13" x2="51" y2="51"/>
      <line x1="13" y1="51" x2="51" y2="13"/>
    </g>
    <circle cx="32" cy="32" r="4.5" fill="#2F6F4E"/>
  </svg>
  <div class="loader-word">E-MANAGER</div>
  <div class="loader-dots"><span></span><span></span><span></span></div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menu-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="brand">
        <div class="brand-text">
          <span class="brand-credit">By Kabya Saha</span>
          <span class="brand-name">E-Manager</span>
        </div>
        <span class="brand-date" id="brand-date"></span>
      </div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle day and night mode">
      <span class="thumb">
        <svg id="theme-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4" y1="12" x2="2" y2="12"/><line x1="22" y1="12" x2="20" y2="12"/></svg>
      </span>
    </button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="icon-btn" id="drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <button class="nav-item" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </button>
    <button class="nav-item" data-view="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      Schedule
    </button>
    <button class="nav-item" data-view="payment">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><line x1="2.5" y1="10.5" x2="21.5" y2="10.5"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
      Payment
    </button>
    <div class="drawer-foot" id="drawer-shop-name">Cycle Rental Manager</div>
  </nav>

  <main id="view-root"></main>
</div>

<div class="modal-backdrop" id="booking-modal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="booking-modal-title">New booking</span>
      <button class="icon-btn" id="booking-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Customer name</label><input id="b-customer" type="text" placeholder="e.g. Rahim Uddin"></div>
      <div class="field"><label>Phone (optional)</label><input id="b-phone" type="tel" placeholder="01XXXXXXXXX"></div>
      <div class="field"><label>Date</label><input id="b-date" type="date"></div>
      <div class="field"><label>Pickup time</label><input id="b-start" type="time"></div>
      <div class="field"><label id="b-price-label">Price per day</label><input id="b-price" type="number" min="0" placeholder="0"></div>
      <div class="check-row">
        <div class="switch" id="b-paid-switch"><div class="dot"></div></div>
        <span style="font-size:13px;">Mark as paid</span>
      </div>
      <div class="error-text" id="b-error"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="b-delete" style="display:none;">Delete</button>
      <button class="btn btn-primary" id="b-save">Save booking</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="income-modal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Add income</span>
      <button class="icon-btn" id="income-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Source / customer</label><input id="i-source" type="text" placeholder="e.g. Helmet sale, deposit..."></div>
      <div class="row2">
        <div class="field"><label>Amount</label><input id="i-amount" type="number" min="0" placeholder="0"></div>
        <div class="field"><label>Date</label><input id="i-date" type="date"></div>
      </div>
      <div class="check-row">
        <div class="switch" id="i-paid-switch"><div class="dot"></div></div>
        <span style="font-size:13px;">Received already</span>
      </div>
      <div class="field"><label>Note (optional)</label><textarea id="i-note"></textarea></div>
      <div class="error-text" id="i-error"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="i-delete" style="display:none;">Delete</button>
      <button class="btn btn-primary" id="i-save">Save</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Storage ---------------- */
  const STORAGE_KEY = "emanager_data_v1";
  function defaultData(){
    return {
      theme:"light",
      currency:"৳",
      shop:{name:"",owner:"",phone:"",email:"",address:"",bikes:"",notes:""},
      bookings:[],
      extraIncome:[]
    };
  }
  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value) return Object.assign(defaultData(), JSON.parse(res.value));
    }catch(e){ /* no data yet */ }
    return defaultData();
  }
  let saveTimer=null;
  function saveData(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async ()=>{
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }
      catch(e){ console.error("Save failed", e); }
    }, 150);
  }

  /* ---------------- State ---------------- */
  let state = defaultData();
  let view = "dashboard";
  const today = new Date();
  let cal = { year: today.getFullYear(), month: today.getMonth() };
  let selectedDate = fmtDate(today);
  let scheduleSearch = "";
  let paymentFilter = "all";

  /* ---------------- Helpers ---------------- */
  function uid(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function fmtDate(d){ return d.toISOString().slice(0,10); }
  function todayStr(){ return fmtDate(new Date()); }
  function niceDate(str){
    const d=new Date(str+"T00:00:00");
    return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  }
  function niceTime(t){
    if(!t) return "";
    const [h,m]=t.split(":").map(Number);
    const ap=h>=12?"PM":"AM"; let hh=h%12; if(hh===0)hh=12;
    return hh+":"+String(m).padStart(2,"0")+" "+ap;
  }
  function money(n){
    n = Number(n)||0;
    return state.currency + n.toLocaleString(undefined,{maximumFractionDigits:0});
  }
  function timeToMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
  function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function toast(msg, kind){
    const c=document.getElementById("toast-container");
    const el=document.createElement("div");
    el.className="toast";
    el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>'+esc(msg)+"</span>";
    c.appendChild(el);
    requestAnimationFrame(()=>el.classList.add("show"));
    setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),300); }, 2200);
  }

  /* ---------------- Theme ---------------- */
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    const icon=document.getElementById("theme-icon");
    if(state.theme==="dark"){
      icon.innerHTML='<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
    }else{
      icon.innerHTML='<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4" y1="12" x2="2" y2="12"/><line x1="22" y1="12" x2="20" y2="12"/><line x1="19.07" y1="4.93" x2="17.66" y2="6.34"/><line x1="6.34" y1="17.66" x2="4.93" y2="19.07"/><line x1="19.07" y1="19.07" x2="17.66" y2="17.66"/><line x1="6.34" y1="6.34" x2="4.93" y2="4.93"/>';
    }
  }
  document.getElementById("theme-toggle").addEventListener("click", ()=>{
    state.theme = state.theme==="dark" ? "light" : "dark";
    applyTheme(); saveData();
  });

  /* ---------------- Drawer ---------------- */
  const drawer=document.getElementById("drawer"), backdrop=document.getElementById("backdrop");
  function openDrawer(){ drawer.classList.add("show"); backdrop.classList.add("show"); }
  function closeDrawer(){ drawer.classList.remove("show"); backdrop.classList.remove("show"); }
  document.getElementById("menu-btn").addEventListener("click", openDrawer);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  backdrop.addEventListener("click", closeDrawer);
  drawer.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      view = btn.dataset.view;
      closeDrawer();
      render();
    });
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeDrawer(); closeBookingModal(); closeIncomeModal(); }});

  /* ---------------- Data helpers ---------------- */
  function bookingsOn(dateStr){
    return state.bookings.filter(b=>b.date===dateStr).sort((a,b)=>a.start.localeCompare(b.start));
  }
  function totals(){
    let earned=0, due=0;
    state.bookings.forEach(b=>{ if(b.paid) earned+=Number(b.price)||0; else due+=Number(b.price)||0; });
    state.extraIncome.forEach(i=>{ if(i.paid) earned+=Number(i.amount)||0; else due+=Number(i.amount)||0; });
    return {earned, due};
  }

  /* ================= RENDER ================= */
  function render(){
    document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
    const root=document.getElementById("view-root");
    root.innerHTML="";
    root.classList.remove("view"); void root.offsetWidth; root.classList.add("view");
    if(view==="schedule") renderSchedule(root);
    else if(view==="payment") renderPayment(root);
    else renderDashboard(root);
    document.getElementById("drawer-shop-name").textContent = state.shop.name || "Cycle Rental Manager";
  }

  function renderDashboard(root){
    const t = totals();
    const todays = bookingsOn(todayStr());
    const uniqueCustomers = new Set(state.bookings.map(b=>b.customer.trim().toLowerCase())).size;
    const wrap=document.createElement("div");
    wrap.innerHTML=`
      <div class="view-head">
        <div></div>
        <button class="btn btn-primary" id="dash-add"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New booking</button>
      </div>
      <div class="grid-stats">
        <div class="card stat accent"><div class="stat-label">Today's bookings</div><div class="stat-value">${todays.length}</div></div>
        <div class="card stat"><div class="stat-label">Total earned</div><div class="stat-value">${money(t.earned)}</div></div>
        <div class="card stat warn"><div class="stat-label">Total due</div><div class="stat-value">${money(t.due)}</div></div>
        <div class="card stat"><div class="stat-label">Customers</div><div class="stat-value">${uniqueCustomers}</div></div>
      </div>
      <div class="card">
        <div class="agenda-head"><span class="agenda-title">Today's schedule</span><span class="view-sub">${niceDate(todayStr())}</span></div>
        <div class="agenda-list" id="dash-today"></div>
      </div>
    `;
    root.appendChild(wrap);
    const list=wrap.querySelector("#dash-today");
    if(todays.length===0){
      list.innerHTML=emptyState("No bookings today","Tap New booking to schedule a rental.");
    }else{
      todays.forEach(b=> list.appendChild(bookingRow(b)));
    }
    wrap.querySelector("#dash-add").addEventListener("click", ()=>openBookingModal(todayStr()));
  }

  const ICON_CYCLE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="7" cy="18" r="3"/><circle cx="17" cy="18" r="3"/><path d="M7 18L11 8h4M17 18l-4-9M11 8h3"/></svg>';
  const ICON_WALLET = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.2" cy="14" r="1.1" fill="var(--border)" stroke="none"/></svg>';
  function emptyState(title,sub,icon){
    return `<div class="empty">
      ${icon || ICON_CYCLE}
      <div style="font-weight:600;color:var(--text);">${esc(title)}</div>
      ${sub ? `<div>${esc(sub)}</div>` : ""}
    </div>`;
  }

  function bookingRow(b){
    const row=document.createElement("div");
    row.className="booking-row";
    row.innerHTML=`
      <div class="booking-time">${niceTime(b.start)}${b.type==="daily"?"":" – "+niceTime(b.end)}</div>
      <div class="booking-info">
        <div class="booking-name">${esc(b.customer)}</div>
        <div class="booking-sub">${b.type==="daily"?"Daily rental":"Hourly rental"}${b.phone? " · "+esc(b.phone):""} · ${money(b.price)}</div>
      </div>
      <span class="badge ${b.paid?"paid":"due"}">${b.paid?"Paid":"Due"}</span>
      <div class="row-actions">
        <button class="icon-btn btn-sm edit-b" data-id="${b.id}" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
    `;
    row.querySelector(".edit-b").addEventListener("click", ()=>openBookingModal(b.date, b.start, b.id));
    return row;
  }

  /* ---------------- Schedule ---------------- */
  function renderSchedule(root){
    const wrap=document.createElement("div");
    wrap.innerHTML=`
      <div class="view-head">
        <div><h1 class="view-title">Schedule</h1></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="sch-search" type="text" placeholder="Search customer..." value="${esc(scheduleSearch)}">
          </div>
          <button class="btn btn-primary" id="sch-add"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New</button>
        </div>
      </div>
      <div class="card">
        <div class="agenda-head"><span class="agenda-title">All customers</span><span class="view-sub" id="sch-count"></span></div>
        <div class="agenda-list" id="sch-list" style="padding:12px;"></div>
      </div>
    `;
    root.appendChild(wrap);
    wrap.querySelector("#sch-add").addEventListener("click", ()=>openBookingModal(todayStr()));
    wrap.querySelector("#sch-search").addEventListener("input", e=>{ scheduleSearch=e.target.value; renderScheduleList(); });
    renderScheduleList();
  }

  function renderScheduleList(){
    const list=document.getElementById("sch-list");
    const countEl=document.getElementById("sch-count");
    if(!list) return;
    const q=scheduleSearch.trim().toLowerCase();
    const now=todayStr();
    let items = state.bookings.filter(b=> !q || b.customer.toLowerCase().includes(q) || (b.phone||"").toLowerCase().includes(q));
    items = items.slice().sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
    countEl.textContent = items.length + (items.length===1?" customer":" customers");
    if(items.length===0){ list.innerHTML=emptyState("No customers yet","Tap New to add your first booking."); return; }
    list.innerHTML="";
    items.forEach(b=>{
      const row=bookingRow(b);
      const sub=row.querySelector(".booking-sub");
      const status = b.date<now ? "Past" : (b.date===now ? "Today" : "Upcoming");
      sub.textContent = niceDate(b.date)+" · "+status+" · "+sub.textContent;
      list.appendChild(row);
    });
  }

  /* ---------------- Payment ---------------- */
  function renderPayment(root){
    const t=totals();
    const wrap=document.createElement("div");
    wrap.innerHTML=`
      <div class="view-head">
        <div><h1 class="view-title">Payment</h1></div>
        <button class="btn btn-primary" id="pay-add"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add income</button>
      </div>
      <div class="grid-stats">
        <div class="card stat accent"><div class="stat-label">Total earned</div><div class="stat-value">${money(t.earned)}</div></div>
        <div class="card stat warn"><div class="stat-label">Total due</div><div class="stat-value">${money(t.due)}</div></div>
        <div class="card stat"><div class="stat-label">Net</div><div class="stat-value">${money(t.earned-t.due)}</div></div>
      </div>
      <div class="tabs" id="pay-tabs">
        <button class="tab ${paymentFilter==='all'?'active':''}" data-f="all">All</button>
        <button class="tab ${paymentFilter==='paid'?'active':''}" data-f="paid">Paid</button>
        <button class="tab ${paymentFilter==='due'?'active':''}" data-f="due">Due</button>
      </div>
      <div class="section-title">Rental bookings</div>
      <div class="card"><div class="agenda-list" id="pay-bookings" style="padding:12px;"></div></div>
      <div class="section-title">Other income</div>
      <div class="card"><div class="agenda-list" id="pay-income" style="padding:12px;"></div></div>
    `;
    root.appendChild(wrap);
    wrap.querySelector("#pay-add").addEventListener("click", openIncomeModal);
    wrap.querySelectorAll("#pay-tabs .tab").forEach(b=> b.addEventListener("click", ()=>{ paymentFilter=b.dataset.f; render(); }));

    const filt = arr => arr.filter(x=> paymentFilter==="all" ? true : (paymentFilter==="paid"? x.paid : !x.paid));
    const bList = wrap.querySelector("#pay-bookings");
    const bookings = filt(state.bookings).sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
    if(bookings.length===0) bList.innerHTML = emptyState("No bookings here","Bookings you create in Schedule appear here.");
    else bookings.forEach(b=> bList.appendChild(bookingRow(b)));

    const iList = wrap.querySelector("#pay-income");
    const income = filt(state.extraIncome).sort((a,b)=> (b.date).localeCompare(a.date));
    if(income.length===0) iList.innerHTML = emptyState("No other income recorded", "", ICON_WALLET);
    else income.forEach(i=>{
      const row=document.createElement("div");
      row.className="booking-row";
      row.innerHTML=`
        <div class="booking-time">${niceDate(i.date)}</div>
        <div class="booking-info"><div class="booking-name">${esc(i.source)}</div><div class="booking-sub">${money(i.amount)}${i.note? " · "+esc(i.note):""}</div></div>
        <span class="badge ${i.paid?"paid":"due"}">${i.paid?"Paid":"Due"}</span>
        <div class="row-actions"><button class="icon-btn btn-sm edit-i" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
      `;
      row.querySelector(".edit-i").addEventListener("click", ()=>openIncomeModal(i.id));
      iList.appendChild(row);
    });
  }

  /* ================= Booking Modal ================= */
  const bModal=document.getElementById("booking-modal");
  let bEditId=null, bPaid=false, bDeleteArmed=false;

  function openBookingModal(dateStr, startTime, editId){
    bEditId = editId || null;
    bDeleteArmed = false;
    document.getElementById("b-delete").textContent="Delete";
    document.getElementById("b-error").textContent="";
    document.getElementById("b-delete").style.display = editId ? "inline-flex" : "none";
    document.getElementById("booking-modal-title").textContent = editId ? "Edit booking" : "New booking";
    if(editId){
      const b = state.bookings.find(x=>x.id===editId);
      document.getElementById("b-customer").value=b.customer;
      document.getElementById("b-phone").value=b.phone||"";
      document.getElementById("b-date").value=b.date;
      document.getElementById("b-start").value=b.start;
      document.getElementById("b-price").value=b.price;
      bPaid=b.paid;
    }else{
      document.getElementById("b-customer").value="";
      document.getElementById("b-phone").value="";
      document.getElementById("b-date").value=dateStr||selectedDate;
      document.getElementById("b-start").value=startTime||"10:00";
      document.getElementById("b-price").value="";
      bPaid=false;
    }
    setSwitch("b-paid-switch", bPaid);
    bModal.classList.add("show");
    setTimeout(()=>document.getElementById("b-customer").focus(),120);
  }
  function closeBookingModal(){ bModal.classList.remove("show"); bDeleteArmed=false; document.getElementById("b-delete").textContent="Delete"; }
  document.getElementById("booking-close").addEventListener("click", closeBookingModal);
  bModal.addEventListener("click", e=>{ if(e.target===bModal) closeBookingModal(); });

  function setSwitch(id,on){
    const el=document.getElementById(id);
    el.classList.toggle("on", !!on);
    if(id==="b-paid-switch") bPaid=on; else iPaid=on;
  }
  document.getElementById("b-paid-switch").addEventListener("click", ()=> setSwitch("b-paid-switch", !bPaid));

  document.getElementById("b-save").addEventListener("click", ()=>{
    const customer=document.getElementById("b-customer").value.trim();
    const date=document.getElementById("b-date").value;
    const start=document.getElementById("b-start").value;
    const price=document.getElementById("b-price").value;
    const err=document.getElementById("b-error");
    if(!customer){ err.textContent="Please enter the customer's name."; return; }
    if(!date || !start){ err.textContent="Please choose a date and pickup time."; return; }
    err.textContent="";
    const obj={
      id: bEditId || uid(),
      customer, phone: document.getElementById("b-phone").value.trim(),
      type: "daily", date, start, end: "",
      price: Number(price)||0, paid: bPaid,
      notes: ""
    };
    if(bEditId){
      const idx=state.bookings.findIndex(x=>x.id===bEditId);
      state.bookings[idx]=obj;
    }else{
      state.bookings.push(obj);
    }
    selectedDate=date;
    saveData(); closeBookingModal(); toast(bEditId?"Booking updated":"Booking saved"); render();
  });
  document.getElementById("b-delete").addEventListener("click", ()=>{
    if(!bEditId) return;
    const btn=document.getElementById("b-delete");
    if(!bDeleteArmed){
      bDeleteArmed=true;
      btn.textContent="Tap again to delete";
      setTimeout(()=>{ if(bDeleteArmed){ bDeleteArmed=false; btn.textContent="Delete"; } }, 2500);
      return;
    }
    bDeleteArmed=false;
    state.bookings = state.bookings.filter(x=>x.id!==bEditId);
    saveData(); closeBookingModal(); toast("Booking deleted"); render();
  });

  /* ================= Income Modal ================= */
  const iModal=document.getElementById("income-modal");
  let iEditId=null, iPaid=false, iDeleteArmed=false;
  function openIncomeModal(editId){
    iEditId = editId || null;
    iDeleteArmed = false;
    document.getElementById("i-delete").textContent="Delete";
    document.getElementById("i-error").textContent="";
    document.getElementById("i-delete").style.display = editId ? "inline-flex" : "none";
    if(editId){
      const i=state.extraIncome.find(x=>x.id===editId);
      document.getElementById("i-source").value=i.source;
      document.getElementById("i-amount").value=i.amount;
      document.getElementById("i-date").value=i.date;
      document.getElementById("i-note").value=i.note||"";
      iPaid=i.paid;
    }else{
      document.getElementById("i-source").value="";
      document.getElementById("i-amount").value="";
      document.getElementById("i-date").value=todayStr();
      document.getElementById("i-note").value="";
      iPaid=true;
    }
    setSwitch("i-paid-switch", iPaid);
    iModal.classList.add("show");
    setTimeout(()=>document.getElementById("i-source").focus(),120);
  }
  function closeIncomeModal(){ iModal.classList.remove("show"); iDeleteArmed=false; document.getElementById("i-delete").textContent="Delete"; }
  document.getElementById("income-close").addEventListener("click", closeIncomeModal);
  iModal.addEventListener("click", e=>{ if(e.target===iModal) closeIncomeModal(); });
  document.getElementById("i-paid-switch").addEventListener("click", ()=> setSwitch("i-paid-switch", !iPaid));

  document.getElementById("i-save").addEventListener("click", ()=>{
    const source=document.getElementById("i-source").value.trim();
    const amount=document.getElementById("i-amount").value;
    const date=document.getElementById("i-date").value;
    const err=document.getElementById("i-error");
    if(!source){ err.textContent="Please enter a source or customer name."; return; }
    if(!amount || Number(amount)<=0){ err.textContent="Please enter an amount."; return; }
    err.textContent="";
    const obj={ id: iEditId || uid(), source, amount:Number(amount), date: date||todayStr(), paid: iPaid, note: document.getElementById("i-note").value.trim() };
    if(iEditId){ const idx=state.extraIncome.findIndex(x=>x.id===iEditId); state.extraIncome[idx]=obj; }
    else state.extraIncome.push(obj);
    saveData(); closeIncomeModal(); toast(iEditId?"Income updated":"Income added"); render();
  });
  document.getElementById("i-delete").addEventListener("click", ()=>{
    if(!iEditId) return;
    const btn=document.getElementById("i-delete");
    if(!iDeleteArmed){
      iDeleteArmed=true;
      btn.textContent="Tap again to delete";
      setTimeout(()=>{ if(iDeleteArmed){ iDeleteArmed=false; btn.textContent="Delete"; } }, 2500);
      return;
    }
    iDeleteArmed=false;
    state.extraIncome = state.extraIncome.filter(x=>x.id!==iEditId);
    saveData(); closeIncomeModal(); toast("Entry deleted"); render();
  });


  /* ---------------- Boot ---------------- */
  document.getElementById("brand-date").textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});

  (async function init(){
    const loadPromise = loadData();
    const minWait = new Promise(res=>setTimeout(res, 1100));
    const [data] = await Promise.all([loadPromise, minWait]);
    state = data;
    applyTheme();
    render();
    document.getElementById("app").classList.add("ready");
    document.getElementById("loader").classList.add("hide");
  })();

})();
</script>
</body>
</html>
